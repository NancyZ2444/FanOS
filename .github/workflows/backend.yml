name: Backend CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/crawler-worker/**"
      - "contracts/**"
      - "database/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/crawler-worker/**"
      - "contracts/**"
      - "database/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check app tests scripts migrations --exclude app/integrations/card_matcher/vendor
      - run: ruff check app tests scripts migrations --exclude app/integrations/card_matcher/vendor
      - run: pytest
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:////tmp/fan_os_ci.db
          AUTO_SEED: "false"
      - run: alembic check
        env:
          DATABASE_URL: sqlite:////tmp/fan_os_ci.db
          AUTO_SEED: "false"

  crawler-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crawler-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff format --check worker tests
      - run: ruff check worker tests
      - run: pytest
